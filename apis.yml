name: Apple Pay
description: >-
  Apple Pay enables secure, frictionless payments in apps and on the web using the payment cards stored in users' Apple
  Wallet. It supports Touch ID, Face ID, and Apple Watch authentication for both in-person and online payments. Apple
  Pay is available on iOS, watchOS, macOS, and via Safari on the web through the Apple Pay JS API, with a PassKit native
  framework for iOS/watchOS app integration.
